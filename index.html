// True when the 3D engine loaded and this phone can draw 3D graphics.
const can3D = () => {
  if (!window.Battle3D) return false;
  try {
    const gl = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
    if (!gl) return false;
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    return true;
  } catch (e) { return false; }
};

// The 3D battlefield (battle3d.js) filling its parent. Made once per battle;
// hands the scene up through onReady, or reports onError so the game can fall
// back to the classic battle.
const MOVES_PANEL_WIDTH = 250; // the move buttons floating at the left of the 3D battle
const Battle3DStage = ({ arena, trainers, onReady, onError }) => {
  const ref = useRef(null);
  useEffect(() => {
    let scene = null;
    try {
      scene = window.Battle3D.create({ container: ref.current, arena, trainers, insetLeft: MOVES_PANEL_WIDTH + 12 });
      scene.onError = onError;
      onReady(scene);
    } catch (err) {
      console.error(err);
      onError(err);
    }
    return () => { if (scene) scene.dispose(); };
  }, []);
  return <div ref={ref} style={{ position: 'absolute', inset: 0, overflow: 'hidden' }} />;
};

// A trainer's box floating over the 3D battlefield: their team (tap to
// switch), the Pokemon that is out, its status, boosts and health.
const HudCard = ({ trainer, team, hpArray, activeIndex, statuses, boosts, isTurn, canSwitch, onSwitch, style }) => {
  const pokemon = team[activeIndex];
  const typeData = TYPE_DATA[pokemon.type] || TYPE_DATA.normal;
  const status = statuses[activeIndex];
  const statusInfo = status ? STATUS_DATA[status] : null;
  const b = boosts[activeIndex] || {};
  const hp = hpArray[activeIndex];
  return (
    <div style={{ position: 'absolute', zIndex: 2, width: '196px', padding: '5px 7px', borderRadius: '10px', background: 'rgba(14,16,28,0.8)', border: `2px solid ${isTurn ? '#FFD700' : trainer.color}`, boxShadow: isTurn ? '0 0 10px #FFD700' : '0 2px 6px rgba(0,0,0,0.5)', color: 'white', ...style }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '4px', fontSize: '12px', fontWeight: 'bold' }}>
        <img src={trainer.img} alt={trainer.name} style={{ width: '16px', height: '16px', imageRendering: 'pixelated' }} />
        <span style={{ color: trainer.color, textShadow: '0 1px 2px #000', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{trainer.name}</span>
        {isTurn && <span style={{ color: '#FFD700', animation: 'pulse 1s infinite' }}>★</span>}
        <div style={{ marginLeft: 'auto', display: 'flex', gap: '3px' }}>
          {team.map((p, i) => {
            const alive = hpArray[i] > 0;
            const clickable = canSwitch && alive && i !== activeIndex;
            return (
              <div key={i} onClick={clickable ? () => onSwitch(i) : null} style={{ width: '30px', height: '30px', borderRadius: '50%', background: i === activeIndex ? '#FFD700' : alive ? (TYPE_DATA[p.type] || TYPE_DATA.normal).color : '#444', opacity: alive ? 1 : 0.4, border: clickable ? '2px solid #4CAF50' : '1px solid #222', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', cursor: clickable ? 'pointer' : 'default', position: 'relative' }}>
                <img src={p.img} alt={p.name} style={{ width: '28px', height: '28px' }} />
                {statuses[i] && <div style={{ position: 'absolute', bottom: 0, right: 0, fontSize: '7px', background: STATUS_DATA[statuses[i]].color, borderRadius: '50%', width: '10px', height: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{STATUS_DATA[statuses[i]].icon}</div>}
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: '3px', margin: '3px 0', fontSize: '12px', fontWeight: 'bold', flexWrap: 'wrap' }}>
        <span>{typeData.icon}</span>
        <span>{pokemon.name}</span>
        {statusInfo && <span style={{ padding: '1px 4px', borderRadius: '4px', background: statusInfo.color, fontSize: '9px' }}>{statusInfo.icon} {statusInfo.name}</span>}
        {b.atk > 0 && <span style={{ background: '#E53935', padding: '1px 3px', borderRadius: '3px', fontSize: '8px' }}>+{b.atk}ATK</span>}
        {b.def > 0 && <span style={{ background: '#2196F3', padding: '1px 3px', borderRadius: '3px', fontSize: '8px' }}>+{b.def}DEF</span>}
        {b.spd > 0 && <span style={{ background: '#4CAF50', padding: '1px 3px', borderRadius: '3px', fontSize: '8px' }}>+{b.spd}SPD</span>}
      </div>
      <HealthBar current={hp} max={pokemon.hp} />
      <div style={{ fontSize: '10px', color: '#bbb', marginTop: '2px', textAlign: 'right', fontFamily: 'monospace' }}>{hp}/{pokemon.hp}</div>
    </div>
  );
};

function PokemonBattle() {
  const [phase, setPhase] = useState('title');
  const [browsing, setBrowsing] = useState(null); // the Pokemon being looked at on the pick screen
  const [trainer1, setTrainer1] = useState(null);
  const [trainer2, setTrainer2] = useState(null);
  const [player1Team, setPlayer1Team] = useState([]);
  const [player2Team, setPlayer2Team] = useState([]);
  const [player1Active, setPlayer1Active] = useState(0);
  const [player2Active, setPlayer2Active] = useState(0);
  const [player1HP, setPlayer1HP] = useState([]);
  const [player2HP, setPlayer2HP] = useState([]);
  const [player1Status, setPlayer1Status] = useState([null, null, null]);
  const [player2Status, setPlayer2Status] = useState([null, null, null]);
  const [player1Boosts, setPlayer1Boosts] = useState([{atk:0,def:0,spd:0},{atk:0,def:0,spd:0},{atk:0,def:0,spd:0}]);
  const [player2Boosts, setPlayer2Boosts] = useState([{atk:0,def:0,spd:0},{atk:0,def:0,spd:0},{atk:0,def:0,spd:0}]);
  const [player1SleepTurns, setPlayer1SleepTurns] = useState([0,0,0]);
  const [player2SleepTurns, setPlayer2SleepTurns] = useState([0,0,0]);
  const [turn, setTurn] = useState(1);
  const [message, setMessage] = useState('');
  const [winner, setWinner] = useState(null);
  const [animating, setAnimating] = useState(false);
  const [shakeTarget, setShakeTarget] = useState(null);
  const [flashTarget, setFlashTarget] = useState(null);
  const [faintingPokemon, setFaintingPokemon] = useState(null);
  const [attackAnim, setAttackAnim] = useState(null);
  const [floatingTexts, setFloatingTexts] = useState([]);
  const [screenFlash, setScreenFlash] = useState(null);
  const [showVS, setShowVS] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);
  const [scene, setScene] = useState(null);
  const [use3D, setUse3D] = useState(false);
  const [scene3d, setScene3d] = useState(null);
  const [busy3D, setBusy3D] = useState(0);
  const scene3dRef = useRef(null);
  scene3dRef.current = scene3d;
  
  const { playSound, playAttackSound, playPokemonCry } = useSound();
  const landscape = useIsLandscape();

  const addFloatingText = (text, color, large = false, side = null) => {
    const id = Date.now() + Math.random();
    let x = side === 'left' ? '25%' : side === 'right' ? '75%' : '50%', y = null;
    // Over the 3D battlefield, float the text over that side's Pokemon.
    const s3 = scene3dRef.current;
    if (s3 && side) {
      const a = s3.anchor(side === 'left' ? 1 : 2);
      if (a) { x = `${Math.round(a.x)}px`; y = `${Math.round(a.y)}px`; }
    }
    setFloatingTexts(prev => [...prev, { id, text, color, large, x, y }]);
    setTimeout(() => setFloatingTexts(prev => prev.filter(t => t.id !== id)), 1200);
  };

  // The 3D battlefield follows the battle: it throws out whichever Pokemon is
  // active, and plays attacks, hits and faints as the battle sets them off.
  // While a Pokemon is still coming out of its ball, moves wait (busy3D).
  const track3D = promise => {
    setBusy3D(n => n + 1);
    const safety = new Promise(resolve => setTimeout(resolve, 6000));
    Promise.race([promise, safety]).finally(() => setBusy3D(n => Math.max(0, n - 1)));
  };
  const sentOut = useRef({ 1: null, 2: null });
  useEffect(() => { sentOut.current = { 1: null, 2: null }; setBusy3D(0); }, [scene3d]);
  const activeKey = (team, i) => (phase === 'battle' && team[i] ? `${i}|${team[i].img}` : null);
  const p1Key = activeKey(player1Team, player1Active);
  const p2Key = activeKey(player2Team, player2Active);
  useEffect(() => {
    if (!scene3d) return;
    [[1, p1Key, player1Team[player1Active]], [2, p2Key, player2Team[player2Active]]].forEach(([side, key, pokemon]) => {
      const prev = sentOut.current[side];
      if (!key || key === prev) return;
      sentOut.current[side] = key;
      if (prev === null) {
        // Opening throws: player 1 first, player 2 a moment later.
        const wait = new Promise(resolve => setTimeout(resolve, side === 2 ? 700 : 0));
        track3D(wait.then(() => scene3d.sendOut(side, pokemon)));
      } else if (prev.split('|')[0] === key.split('|')[0]) {
        track3D(scene3d.swap(side, pokemon)); // same slot, new look: Ditto transformed
      } else {
        scene3d.recall(side); // no-op if it already fainted
        track3D(scene3d.sendOut(side, pokemon));
      }
    });
  }, [scene3d, p1Key, p2Key]);
  useEffect(() => { if (scene3d && attackAnim) scene3d.attack(attackAnim.side === 'left' ? 1 : 2, attackAnim.type, attackAnim.kind, attackAnim.result); }, [scene3d, attackAnim]);
  useEffect(() => { if (scene3d && flashTarget) scene3d.hit(flashTarget); }, [scene3d, flashTarget]);
  useEffect(() => { if (scene3d && faintingPokemon) scene3d.faint(faintingPokemon); }, [scene3d, faintingPokemon]);

  const resetGame = () => {
    setPhase('trainer1'); setTrainer1(null); setTrainer2(null);
    setPlayer1Team([]); setPlayer2Team([]); setPlayer1Active(0); setPlayer2Active(0);
    setPlayer1HP([]); setPlayer2HP([]); setPlayer1Status([null,null,null]); setPlayer2Status([null,null,null]);
    setPlayer1Boosts([{atk:0,def:0,spd:0},{atk:0,def:0,spd:0},{atk:0,def:0,spd:0}]);
    setPlayer2Boosts([{atk:0,def:0,spd:0},{atk:0,def:0,spd:0},{atk:0,def:0,spd:0}]);
    setPlayer1SleepTurns([0,0,0]); setPlayer2SleepTurns([0,0,0]);
    setTurn(1); setMessage(''); setWinner(null); setAnimating(false); setFloatingTexts([]);
    setShowVS(false); setShowConfetti(false); setScene(null); setBrowsing(null);
    setUse3D(false); setScene3d(null); setBusy3D(0);
  };

  const goBack = () => {
    playSound("select");
    if (phase === "trainer2") { setPhase("trainer1"); setTrainer2(null); }
    else if (phase === "draft") {
      // Undo the last pick; with none left, go back to choosing trainers.
      setBrowsing(null);
      if (player1Team.length > player2Team.length) setPlayer1Team(player1Team.slice(0, -1));
      else if (player2Team.length) setPlayer2Team(player2Team.slice(0, -1));
      else setPhase("trainer2");
    }
    else if (phase === "scene") { setPhase("draft"); setScene(null); }
  };

  // Players take turns picking (Player 1, Player 2, Player 1...) until each has three.
  const draftPlayer = player1Team.length > player2Team.length ? 2 : 1;
  const draftDone = player2Team.length === 3;
  // Tapping a Pokemon shows it on the stand; its Pick button adds it to the team.
  const browsePokemon = (pokemon) => {
    if (draftDone) return;
    playPokemonCry(pokemon.cry);
    setBrowsing(pokemon);
  };
  const draftPokemon = (pokemon) => {
    playSound('select');
    setBrowsing(null);
    if (draftPlayer === 1) setPlayer1Team([...player1Team, pokemon]);
    else setPlayer2Team([...player2Team, pokemon]);
  };

  const startBattle = () => { playSound('vs'); setShowVS(true); };
  const onVSComplete = () => { setShowVS(false); setPlayer1HP(player1Team.map(p => p.hp)); setPlayer2HP(player2Team.map(p => p.hp)); setPhase('battle'); setMessage(`Battle Start! ${trainer1.name}'s turn!`); };

  const handleSwitch = (newIndex) => {
    if (animating || busy3D) return;
    setAnimating(true);
    const isP1 = turn === 1;
    const team = isP1 ? player1Team : player2Team;
    const setActive = isP1 ? setPlayer1Active : setPlayer2Active;
    const nextTrainer = isP1 ? trainer2 : trainer1;
    setMessage(`${team[newIndex].name}, go!`);
    setActive(newIndex);
    setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${nextTrainer.name}'s turn!`); setAnimating(false); }, 800);
  };

  const doAttack = (attack) => {
    if (animating || busy3D) return;
    setAnimating(true);

    const isP1 = turn === 1;
    const attacker = isP1 ? player1Team[player1Active] : player2Team[player2Active];
    const defender = isP1 ? player2Team[player2Active] : player1Team[player1Active];
    const attackerStatus = isP1 ? player1Status[player1Active] : player2Status[player2Active];
    const attackerBoosts = isP1 ? player1Boosts[player1Active] : player2Boosts[player2Active];
    const defenderBoosts = isP1 ? player2Boosts[player2Active] : player1Boosts[player1Active];
    const defenderHP = isP1 ? [...player2HP] : [...player1HP];
    const setDefenderHP = isP1 ? setPlayer2HP : setPlayer1HP;
    const defenderActive = isP1 ? player2Active : player1Active;
    const setDefenderActive = isP1 ? setPlayer2Active : setPlayer1Active;
    const defenderTeam = isP1 ? player2Team : player1Team;
    const defenderStatusArr = isP1 ? [...player2Status] : [...player1Status];
    const setDefenderStatus = isP1 ? setPlayer2Status : setPlayer1Status;
    const attackerHP = isP1 ? [...player1HP] : [...player2HP];
    const setAttackerHP = isP1 ? setPlayer1HP : setPlayer2HP;
    const attackerActive = isP1 ? player1Active : player2Active;
    const attackerBoostsArr = isP1 ? [...player1Boosts] : [...player2Boosts];
    const setAttackerBoosts = isP1 ? setPlayer1Boosts : setPlayer2Boosts;
    const sleepTurns = isP1 ? [...player1SleepTurns] : [...player2SleepTurns];
    const setSleepTurns = isP1 ? setPlayer1SleepTurns : setPlayer2SleepTurns;
    const attackerStatusArr = isP1 ? [...player1Status] : [...player2Status];
    const setAttackerStatus = isP1 ? setPlayer1Status : setPlayer2Status;
    const attackerSide = isP1 ? 'left' : 'right';
    const defenderSide = isP1 ? 'right' : 'left';

    // Status checks
    if (attackerStatus === 'sleep') {
      sleepTurns[attackerActive]++;
      setSleepTurns(sleepTurns);
      if (sleepTurns[attackerActive] >= 2 + Math.floor(Math.random() * 2)) {
        attackerStatusArr[attackerActive] = null; setAttackerStatus(attackerStatusArr);
        sleepTurns[attackerActive] = 0; setSleepTurns(sleepTurns);
        setMessage(`${attacker.name} woke up!`); addFloatingText('AWAKE!', '#4CAF50', true, attackerSide);
      } else {
        setMessage(`${attacker.name} is asleep!`); addFloatingText('💤 ZZZ', '#3B9AE1', true, attackerSide);
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200);
        return;
      }
    }
    
    if (attackerStatus === 'frozen') {
      if (Math.random() < 0.2) { attackerStatusArr[attackerActive] = null; setAttackerStatus(attackerStatusArr); setMessage(`${attacker.name} thawed!`); addFloatingText('THAWED!', '#51C4D3', true, attackerSide); }
      else { setMessage(`${attacker.name} is frozen!`); addFloatingText('🧊 FROZEN', '#51C4D3', true, attackerSide); setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200); return; }
    }
    
    if (attackerStatus === 'paralysis' && Math.random() < 0.25) {
      setMessage(`${attacker.name} is paralyzed!`); addFloatingText("CAN'T MOVE!", '#FFD93D', true, attackerSide);
      setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200);
      return;
    }

    setMessage(`${attacker.name} used ${attack.name}!`);
    
    // Play attack sound based on type!
    playAttackSound(attack.type);
    
    // Roll for a miss or a dodge now, so the 3D attack already knows how it ends.
    // Speed lets the defender slip away, but priority moves are too quick to dodge.
    const support = attack.heal || attack.fullHeal || attack.boostAtk || attack.boostDef || attack.boostSpd || attack.transform;
    const missed = !support && Math.random() * 100 > attack.accuracy;
    const atkSpd = attacker.spd * (1 + attackerBoosts.spd * 0.5);
    const defSpd = defender.spd * (1 + defenderBoosts.spd * 0.5);
    const dodged = !support && !missed && !attack.priority && Math.random() * 100 < getDodgeChance(defSpd, atkSpd);
    setAttackAnim({ type: attack.type, side: attackerSide, kind: attack.heal || attack.fullHeal ? 'heal' : support ? 'boost' : 'attack', result: missed ? 'miss' : dodged ? 'dodge' : 'hit' });
    setTimeout(() => setAttackAnim(null), 600);

    setTimeout(() => {
      // Healing
      if (attack.heal || attack.fullHeal) {
        const healAmount = attack.fullHeal ? attacker.hp : Math.floor(attacker.hp * (attack.heal / 100));
        const actualHeal = Math.min(healAmount, attacker.hp - attackerHP[attackerActive]);
        attackerHP[attackerActive] = Math.min(attacker.hp, attackerHP[attackerActive] + healAmount);
        setAttackerHP(attackerHP);
        playSound('heal');
        addFloatingText(`+${actualHeal}`, '#4CAF50', true, attackerSide);
        setScreenFlash('#4CAF5066'); setTimeout(() => setScreenFlash(null), 300);
        if (attack.selfSleep) { attackerStatusArr[attackerActive] = 'sleep'; setAttackerStatus(attackerStatusArr); sleepTurns[attackerActive] = 0; setSleepTurns(sleepTurns); setTimeout(() => addFloatingText('💤', '#3B9AE1', false, attackerSide), 400); }
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1000);
        return;
      }
      
      // Stat boosts
      if (attack.boostAtk || attack.boostDef || attack.boostSpd) {
        const newBoosts = {...attackerBoostsArr[attackerActive]};
        let txt = '';
        const boostAmount = attack.boostAtk2 ? 2 : 1;
        if (attack.boostAtk) { newBoosts.atk = Math.min(6, newBoosts.atk + boostAmount); txt += 'ATK '; }
        if (attack.boostDef) { newBoosts.def = Math.min(6, newBoosts.def + 1); txt += 'DEF '; }
        if (attack.boostSpd) { newBoosts.spd = Math.min(6, newBoosts.spd + 1); txt += 'SPD '; }
        attackerBoostsArr[attackerActive] = newBoosts; setAttackerBoosts(attackerBoostsArr);
        playSound('boost');
        addFloatingText(`📈 ${txt}UP!`, '#FFD700', true, attackerSide);
        setScreenFlash('#FFD70044'); setTimeout(() => setScreenFlash(null), 300);
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1000);
        return;
      }

      // Transform
      if (attack.transform) {
        const setAttackerTeam = isP1 ? setPlayer1Team : setPlayer2Team;
        const attackerTeam = isP1 ? player1Team : player2Team;
        const newTeam = attackerTeam.map((p, i) => {
          if (i !== attackerActive) return p;
          return { ...p, atk: defender.atk, def: defender.def, spd: defender.spd, type: defender.type, img: defender.img, model: defender.model, attacks: defender.attacks.map(a => ({...a})), transformed: true, originalName: p.name };
        });
        setAttackerTeam(newTeam);
        playSound('boost');
        addFloatingText('TRANSFORMED!', '#DA70D6', true, attackerSide);
        setScreenFlash('#DA70D666'); setTimeout(() => setScreenFlash(null), 300);
        setMessage(`${attacker.name} transformed into ${defender.name}!`);
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200);
        return;
      }

      // Accuracy check
      if (missed) {
        playSound('miss');
        addFloatingText('MISS!', '#888', true, defenderSide);
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200);
        return;
      }

      // Dodge check (rolled above)
      if (dodged) {
        playSound('miss');
        setMessage(`${defender.name} dodged!`);
        addFloatingText('💨 DODGED!', '#9AA9FE', true, defenderSide);
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200);
        return;
      }

      // Status moves
      if (attack.power === 0 && attack.effect) {
        if (!defenderStatusArr[defenderActive]) {
          defenderStatusArr[defenderActive] = attack.effect; setDefenderStatus(defenderStatusArr);
          addFloatingText(`${STATUS_DATA[attack.effect].name}!`, STATUS_DATA[attack.effect].color, true, defenderSide);
          setScreenFlash(STATUS_DATA[attack.effect].color + '66'); setTimeout(() => setScreenFlash(null), 300);
        } else { addFloatingText('FAILED!', '#888', false, defenderSide); }
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200);
        return;
      }

      // Damage calculation
      const effectiveness = getEffectiveness(attack.type, defender.type);
      const atkStat = attacker.atk * (1 + attackerBoosts.atk * 0.5);
      const defStat = defender.def * (1 + defenderBoosts.def * 0.5);
      const critChance = attack.critBoost ? 0.25 : 0.0625;
      const isCrit = Math.random() < critChance;
      const critMult = isCrit ? 1.5 : 1;
      const randomMult = 0.85 + Math.random() * 0.15;
      let damage = Math.floor(((22 * attack.power * (atkStat / defStat)) / 50 + 2) * effectiveness * critMult * randomMult);
      if (attackerStatus === 'burn') damage = Math.floor(damage * 0.5);
      damage = Math.max(1, damage);
      if (effectiveness === 0) damage = 0;
      
      // Recoil
      if (attack.recoil) {
        const recoilDmg = Math.floor(damage * attack.recoil / 100);
        attackerHP[attackerActive] = Math.max(0, attackerHP[attackerActive] - recoilDmg);
        setAttackerHP(attackerHP);
        setTimeout(() => addFloatingText(`-${recoilDmg}`, '#FF8800', false, attackerSide), 500);
      }

      // Play defender hurt cry!
      if (damage > 0) {
        setTimeout(() => playPokemonCry(defender.cry), 150);
      }

      setFlashTarget(isP1 ? 2 : 1);
      setTimeout(() => { setFlashTarget(null); setShakeTarget(isP1 ? 2 : 1); setTimeout(() => setShakeTarget(null), 400); }, 100);

      if (effectiveness > 1) {
        playSound('superEffective');
        setScreenFlash('#FFD70088');
        setTimeout(() => { addFloatingText('SUPER EFFECTIVE!', '#FFD700', true, defenderSide); setTimeout(() => addFloatingText(`-${damage}`, '#FF4444', true, defenderSide), 250); }, 150);
      } else if (effectiveness < 1 && effectiveness > 0) {
        Sounds.play('hit', { volume: 0.5 });
        setTimeout(() => { addFloatingText('Not effective...', '#888', false, defenderSide); setTimeout(() => addFloatingText(`-${damage}`, '#FFAA44', false, defenderSide), 250); }, 150);
      } else if (effectiveness === 0) {
        playSound('miss');
        addFloatingText('NO EFFECT!', '#666', true, defenderSide);
        setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 1200);
        return;
      } else {
        Sounds.play('hit');
        setTimeout(() => addFloatingText(`-${damage}`, '#FF4444', true, defenderSide), 150);
      }
      
      if (isCrit) { playSound('crit'); setTimeout(() => addFloatingText('CRITICAL!', '#FF6B6B', true, defenderSide), 50); setScreenFlash('#FF444488'); }
      setTimeout(() => setScreenFlash(null), 300);

      defenderHP[defenderActive] = Math.max(0, defenderHP[defenderActive] - damage);
      setDefenderHP(defenderHP);

      if (attack.selfDestruct) { attackerHP[attackerActive] = 0; setAttackerHP(attackerHP); addFloatingText('💥 BOOM!', '#FF6B35', true, attackerSide); }
      if (attack.drainHP && damage > 0) { const drain = Math.floor(damage / 2); attackerHP[attackerActive] = Math.min(attacker.hp, attackerHP[attackerActive] + drain); setAttackerHP(attackerHP); setTimeout(() => addFloatingText(`+${drain}`, '#4CAF50', false, attackerSide), 600); }
      if (attack.effect && attack.effectChance && Math.random() * 100 < attack.effectChance && !defenderStatusArr[defenderActive]) { defenderStatusArr[defenderActive] = attack.effect; setDefenderStatus(defenderStatusArr); setTimeout(() => addFloatingText(`${STATUS_DATA[attack.effect].icon}`, STATUS_DATA[attack.effect].color, false, defenderSide), 700); }

      setTimeout(() => {
        if (attack.selfDestruct && attackerHP[attackerActive] <= 0) {
          playSound('faint'); setFaintingPokemon(isP1 ? 1 : 2);
          setTimeout(() => {
            setFaintingPokemon(null);
            const nextAlive = attackerHP.findIndex((hp) => hp > 0);
            const defenderAlive = defenderHP.findIndex((hp) => hp > 0);
            if (nextAlive === -1 && defenderAlive === -1) { setShowConfetti(true); setPhase('gameover'); setWinner(0); return; }
            else if (nextAlive === -1) { playSound('victory'); setShowConfetti(true); setWinner(isP1 ? 2 : 1); setPhase('gameover'); return; }
            else { if (isP1) setPlayer1Active(nextAlive); else setPlayer2Active(nextAlive); setMessage(`Go, ${(isP1 ? player1Team : player2Team)[nextAlive].name}!`); }
          }, 800);
        }
        
        if (defenderHP[defenderActive] <= 0) {
          playSound('faint'); setFaintingPokemon(isP1 ? 2 : 1);
          addFloatingText('K.O.!', '#FF4444', true, defenderSide);
          setScreenFlash('#00000088'); setTimeout(() => setScreenFlash(null), 400);
          setTimeout(() => {
            setFaintingPokemon(null);
            const nextAlive = defenderHP.findIndex((hp) => hp > 0);
            if (nextAlive === -1) { playSound('victory'); setShowConfetti(true); setWinner(turn); setPhase('gameover'); return; }
            else { setDefenderActive(nextAlive); setMessage(`Go, ${defenderTeam[nextAlive].name}!`); }
            finishTurn();
          }, 1000);
          return;
        }
        
        if (attack.recoil && attackerHP[attackerActive] <= 0) {
          playSound('faint'); setFaintingPokemon(isP1 ? 1 : 2);
          setTimeout(() => {
            setFaintingPokemon(null);
            const nextAlive = attackerHP.findIndex((hp) => hp > 0);
            if (nextAlive === -1) { playSound('victory'); setShowConfetti(true); setWinner(isP1 ? 2 : 1); setPhase('gameover'); return; }
            else { if (isP1) setPlayer1Active(nextAlive); else setPlayer2Active(nextAlive); setMessage(`Go, ${(isP1 ? player1Team : player2Team)[nextAlive].name}!`); }
            finishTurn();
          }, 800);
          return;
        }
        
        finishTurn();
      }, 700);
    }, 500);

    function finishTurn() {
      const curHP = isP1 ? [...player2HP] : [...player1HP];
      const curStatus = isP1 ? player2Status[player2Active] : player1Status[player1Active];
      const curActive = isP1 ? player2Active : player1Active;
      const curPokemon = isP1 ? player2Team[player2Active] : player1Team[player1Active];
      const setCurHP = isP1 ? setPlayer2HP : setPlayer1HP;
      
      if ((curStatus === 'burn' || curStatus === 'poison') && curHP[curActive] > 0) {
        const statusDmg = Math.floor(curPokemon.hp / 8);
        curHP[curActive] = Math.max(0, curHP[curActive] - statusDmg);
        setCurHP(curHP);
        setTimeout(() => {
          addFloatingText(`-${statusDmg}`, curStatus === 'burn' ? '#FF6B35' : '#A040A0', false, defenderSide);
          if (curHP[curActive] <= 0) {
            playSound('faint'); setFaintingPokemon(isP1 ? 2 : 1); addFloatingText('K.O.!', '#FF4444', true, defenderSide);
            setTimeout(() => {
              setFaintingPokemon(null);
              const nextAlive = curHP.findIndex((hp) => hp > 0);
              if (nextAlive === -1) { playSound('victory'); setShowConfetti(true); setWinner(turn); setPhase('gameover'); return; }
              else { if (isP1) setPlayer2Active(nextAlive); else setPlayer1Active(nextAlive); }
              switchTurn();
            }, 800);
            return;
          }
          switchTurn();
        }, 400);
        return;
      }
      switchTurn();
    }
    
    function switchTurn() { setTimeout(() => { setTurn(turn === 1 ? 2 : 1); setMessage(`${turn === 1 ? trainer2.name : trainer1.name}'s turn!`); setAnimating(false); }, 500); }
  };

  if (showVS) return <VSScreen team1={player1Team} team2={player2Team} trainer1={trainer1} trainer2={trainer2} onComplete={onVSComplete} />;

  if (phase === 'title') return <TitleScreen onPlay={() => { playSound('select'); setPhase('trainer1'); }} playSound={playSound} playAttackSound={playAttackSound} />;

  // Trainer selection screens
  if (phase === 'trainer1' || phase === 'trainer2') {
    const currentPlayer = phase === 'trainer1' ? 1 : 2;
    const selectedTrainer = phase === 'trainer1' ? trainer1 : trainer2;
    const setTrainer = phase === 'trainer1' ? setTrainer1 : setTrainer2;
    const otherTrainer = phase === 'trainer1' ? null : trainer1;
    
    return (
      <div style={{ height: 'var(--vh, 100vh)', position: 'relative', fontFamily: "'Segoe UI', sans-serif", display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
        <AnimatedBackground />
        {phase !== 'trainer1' && <BackButton onClick={goBack} />}
        <div style={{ position: 'relative', zIndex: 1, padding: '10px', textAlign: 'center' }}>
          <h2 style={{ color: currentPlayer === 1 ? '#FF6B6B' : '#4ECDC4', fontSize: '20px', margin: '0 0 10px 0' }}>Player {currentPlayer}: Choose Your Trainer!</h2>
          
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px', maxWidth: '600px', margin: '0 auto' }}>
            {TRAINERS.map(trainer => {
              const isSelected = selectedTrainer?.id === trainer.id;
              const isDisabled = otherTrainer?.id === trainer.id;
              return (
                <div key={trainer.id} onClick={() => !isDisabled && setTrainer(trainer)} style={{ 
                  padding: '8px 4px', borderRadius: '10px',
                  background: isSelected ? `linear-gradient(135deg, ${trainer.color} 0%, ${trainer.color}88 100%)` : 'linear-gradient(145deg, #2d2d44, #1a1a2e)',
                  border: isSelected ? '2px solid #FFD700' : '1px solid #444',
                  cursor: isDisabled ? 'not-allowed' : 'pointer',
                  opacity: isDisabled ? 0.3 : 1,
                  transform: isSelected ? 'scale(1.05)' : 'scale(1)',
                  boxShadow: isSelected ? `0 0 12px ${trainer.color}` : 'none',
                  transition: 'all 0.2s'
                }}>
                  <img src={trainer.img} alt={trainer.name} style={{ width: '48px', height: '48px', imageRendering: 'pixelated' }} />
                  <div style={{ color: 'white', fontWeight: 'bold', fontSize: '11px' }}>{trainer.name}</div>
                </div>
              );
            })}
          </div>
          
          {selectedTrainer && (
            <button onClick={() => { playSound('select'); setPhase(phase === 'trainer1' ? 'trainer2' : 'draft'); }} style={{ 
              marginTop: '10px', padding: '10px 30px', fontSize: '16px', fontWeight: 'bold',
              background: 'linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%)', color: 'white',
              border: '2px solid #81C784', borderRadius: '10px', cursor: 'pointer'
            }}>
              {phase === 'trainer1' ? `I'm ${selectedTrainer.name}! →` : `Let's GO! →`}
            </button>
          )}
        </div>
      </div>
    );
  }

  if (phase === 'draft') {
    const picker = draftPlayer === 1 ? trainer1 : trainer2;
    const taken = [...player1Team, ...player2Team];
    // The Pokemon picked most recently stands on the stage.
    const lastSide = player1Team.length > player2Team.length ? 1 : player2Team.length ? 2 : null;
    const lastPick = lastSide === 1 ? player1Team.at(-1) : lastSide === 2 ? player2Team.at(-1) : null;
    const lastPicker = lastSide === 1 ? trainer1 : trainer2;
    // One trainer's three slots; it glows while it is that trainer's turn.
    const teamSlots = (trainer, team, active) => (
      <div style={{ display: 'flex', alignItems: 'center', gap: '6px', background: `${trainer.color}33`, padding: '5px 8px', borderRadius: '8px', border: `2px solid ${active ? '#FFD700' : trainer.color}`, boxShadow: active ? `0 0 14px ${trainer.color}` : 'none', transform: active ? 'scale(1.08)' : 'scale(1)', opacity: active || draftDone ? 1 : 0.55, transition: 'all 0.2s' }}>
        <img src={trainer.img} alt={trainer.name} style={{ width: '26px', height: '26px', imageRendering: 'pixelated' }} />
        <div style={{ display: 'flex', gap: '3px' }}>
          {[0, 1, 2].map(i => {
            const p = team[i];
            const typeData = p ? TYPE_DATA[p.type] : null;
            return <div key={i} style={{ width: '28px', height: '28px', borderRadius: '50%', border: `2px dashed ${p ? typeData.color : '#666'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', background: p ? `${typeData.color}33` : 'transparent', overflow: 'hidden', color: '#888' }}>{p ? <img src={p.img} alt={p.name} style={{ width: '24px', height: '24px' }} /> : '?'}</div>;
          })}
        </div>
      </div>
    );
    return (
      <div style={{ height: 'var(--vh, 100vh)', position: 'relative', fontFamily: "'Segoe UI', sans-serif", display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
        <AnimatedBackground />
        <BackButton onClick={goBack} />
        <div style={{ position: 'relative', zIndex: 1, flex: 1, minHeight: 0, display: 'flex', flexDirection: landscape ? 'row' : 'column', gap: '8px', padding: '8px' }}>
        <div style={{ flex: landscape ? '0 0 36%' : '0 0 auto', display: 'flex', flexDirection: 'column', gap: '6px', minHeight: 0 }}>
          <div style={{ flex: 1, minHeight: landscape ? 0 : '160px' }}>
            {browsing
              ? <PickStage pokemon={browsing} title={browsing.name} color={TYPE_DATA[browsing.type].color} popKey={`look-${browsing.id}`} />
              : <PickStage pokemon={lastPick} title={lastPick && `${lastPicker.name}'s ${lastPick.name}!`} color={lastPicker?.color} popKey={`${lastSide}-${taken.length}`} />}
          </div>
          {browsing && <PokemonInfo pokemon={browsing} color={picker.color} onPick={() => draftPokemon(browsing)} />}
        </div>
        <div style={{ flex: 1, minWidth: 0, overflowY: 'auto' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap', gap: '8px 12px', margin: '0 60px 8px' }}>
            {teamSlots(trainer1, player1Team, !draftDone && draftPlayer === 1)}
            {teamSlots(trainer2, player2Team, !draftDone && draftPlayer === 2)}
          </div>
          <div style={{ textAlign: 'center', marginBottom: '6px', minHeight: '38px' }}>
            {draftDone ? (
              <button onClick={() => { playSound('select'); setPhase('scene'); }} style={{ padding: '8px 20px', fontSize: '15px', fontWeight: 'bold', background: 'linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%)', color: 'white', border: '2px solid #81C784', borderRadius: '8px', cursor: 'pointer' }}>
                Pick where to battle →
              </button>
            ) : (
              <div style={{ color: picker.color, fontSize: '18px', fontWeight: 'bold', textShadow: '0 2px 4px #000' }}>{picker.name}, pick a Pokemon!</div>
            )}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(70px, 1fr))', gap: '3px', margin: '0 auto', gridAutoRows: 'min-content' }}>
            {POKEMON.map(pokemon => <PokemonCard key={pokemon.id} pokemon={pokemon} selected={browsing?.id === pokemon.id} disabled={taken.some(p => p.id === pokemon.id)} onClick={() => browsePokemon(pokemon)} />)}
          </div>
        </div>
        </div>
      </div>
    );
  }

  if (phase === 'scene') {
    return (
      <div style={{ height: 'var(--vh, 100vh)', position: 'relative', fontFamily: "'Segoe UI', sans-serif", display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
        <AnimatedBackground />
        <BackButton onClick={goBack} />
        <div style={{ position: 'relative', zIndex: 1, padding: '10px', textAlign: 'center' }}>
          <h2 style={{ color: '#FFD700', fontSize: '20px', margin: '0 0 10px 0' }}>Where do you want to battle?</h2>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: '8px', maxWidth: '720px', margin: '0 auto' }}>
            {SCENES.map(s => {
              const isSelected = scene?.id === s.id;
              return (
                <div key={s.id} onClick={() => { playSound('select'); setScene(s); }} style={{
                  height: '84px', borderRadius: '12px', background: s.css, cursor: 'pointer',
                  border: isSelected ? '3px solid #FFD700' : '2px solid #444',
                  boxShadow: isSelected ? '0 0 14px #FFD700' : 'none',
                  transform: isSelected ? 'scale(1.05)' : 'scale(1)', transition: 'all 0.2s',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textShadow: '0 2px 4px #000'
                }}>
                  <div style={{ fontSize: '32px' }}>{s.icon}</div>
                  <div style={{ color: 'white', fontWeight: 'bold', fontSize: '14px' }}>{s.name}</div>
                </div>
              );
            })}
          </div>
          {scene && (
            <button onClick={() => { setUse3D(can3D()); startBattle(); }} style={{
              marginTop: '12px', padding: '10px 30px', fontSize: '16px', fontWeight: 'bold',
              background: 'linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%)', color: 'white',
              border: '2px solid #81C784', borderRadius: '10px', cursor: 'pointer'
            }}>
              ⚔️ BATTLE!
            </button>
          )}
        </div>
      </div>
    );
  }

  if (phase === 'battle' && use3D) {
    const p1Pokemon = player1Team[player1Active];
    const p2Pokemon = player2Team[player2Active];
    const currentPokemon = turn === 1 ? p1Pokemon : p2Pokemon;
    const currentTrainer = turn === 1 ? trainer1 : trainer2;
    const defenderType = turn === 1 ? p2Pokemon.type : p1Pokemon.type;
    const locked = animating || busy3D > 0;
    // The battlefield fills the whole screen. The turn message floats at the
    // top, and the move buttons float on the left beside player 1's trainer,
    // so the middle stays clear for the fight. The tree never changes shape,
    // so turning the phone does not rebuild the 3D scene.
    return (
      <div style={{ height: 'var(--vh, 100vh)', position: 'relative', overflow: 'hidden', fontFamily: "'Segoe UI', sans-serif", background: '#000' }}>
        {screenFlash && <ScreenFlash color={screenFlash} />}
        <div style={{ position: 'absolute', inset: 0 }}>
          <Battle3DStage arena={scene.id} trainers={[trainer1.id, trainer2.id]} onReady={setScene3d} onError={() => { setScene3d(null); setUse3D(false); }} />
          <HudCard trainer={trainer2} team={player2Team} hpArray={player2HP} activeIndex={player2Active} statuses={player2Status} boosts={player2Boosts} isTurn={turn === 2} canSwitch={turn === 2 && !locked} onSwitch={handleSwitch} style={{ top: '6px', left: '6px' }} />
          <HudCard trainer={trainer1} team={player1Team} hpArray={player1HP} activeIndex={player1Active} statuses={player1Status} boosts={player1Boosts} isTurn={turn === 1} canSwitch={turn === 1 && !locked} onSwitch={handleSwitch} style={{ bottom: '6px', right: '6px' }} />
          {floatingTexts.map(ft => <FloatingText key={ft.id} text={ft.text} color={ft.color} large={ft.large} x={ft.x} y={ft.y} />)}
        </div>
        <div style={{ position: 'absolute', zIndex: 3, top: '8px', left: '50%', transform: 'translateX(-50%)', maxWidth: '42%', textAlign: 'center', padding: '3px 12px', borderRadius: '14px', background: 'rgba(0,0,0,0.6)', color: currentTrainer.color, fontSize: '15px', fontWeight: 'bold', textShadow: '0 1px 2px #000' }}>{message}</div>
        <div style={{ position: 'absolute', zIndex: 3, left: '6px', top: '50%', transform: 'translateY(-38%)', width: `${MOVES_PANEL_WIDTH}px`, background: 'rgba(0,0,0,0.45)', borderRadius: '10px', padding: '5px', border: `2px solid ${currentTrainer.color}` }}>
          <div style={{ fontSize: '13px', color: '#FFD700', marginBottom: '3px', fontWeight: 'bold', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '3px', textShadow: '0 1px 2px #000' }}>
            <img src={currentPokemon.img} alt={currentPokemon.name} style={{ width: '24px', height: '24px' }} />
            {currentTrainer.name}'s {currentPokemon.name}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '3px' }}>
            {currentPokemon.attacks.map((attack, i) => <AttackButton key={i} attack={attack} disabled={locked} onClick={() => doAttack(attack)} defenderType={defenderType} slotIndex={i} />)}
          </div>
        </div>
        <style>{`@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }`}</style>
      </div>
    );
  }

  if (phase === 'battle') {
    const p1Pokemon = player1Team[player1Active];
    const p2Pokemon = player2Team[player2Active];
    const currentPokemon = turn === 1 ? p1Pokemon : p2Pokemon;
    const currentTrainer = turn === 1 ? trainer1 : trainer2;
    const defenderType = turn === 1 ? p2Pokemon.type : p1Pokemon.type;
    return (
      <div style={{ height: 'var(--vh, 100vh)', position: 'relative', fontFamily: "'Segoe UI', sans-serif", display: 'flex', flexDirection: 'column' }}>
        <AnimatedBackground battle scene={scene} />
        {screenFlash && <ScreenFlash color={screenFlash} />}
        {attackAnim && <AttackAnimation type={attackAnim.type} side={attackAnim.side} />}
        {floatingTexts.map(ft => <FloatingText key={ft.id} text={ft.text} color={ft.color} large={ft.large} x={ft.x} />)}
        
        <div style={{ position: 'relative', zIndex: 1, textAlign: 'center', padding: '4px 10px', background: 'rgba(0,0,0,0.7)' }}>
          <div style={{ color: currentTrainer.color, fontSize: '16px', fontWeight: 'bold' }}>{message}</div>
        </div>
        
        <div style={{ position: 'relative', zIndex: 1, flex: 1, display: 'flex', flexDirection: landscape ? 'row' : 'column', alignItems: 'center', justifyContent: 'space-around', padding: '4px 8px', gap: '4px', minHeight: 0, overflow: 'hidden' }}>
          {/* Player 2: above you in portrait, to your right when turned sideways */}
          <div style={{ width: landscape ? 'auto' : '100%', flex: landscape ? 1 : 'none', order: landscape ? 3 : 1, textAlign: 'center' }}>
            <div style={{ fontSize: '15px', fontWeight: 'bold', color: turn === 2 ? '#FFD700' : '#888', marginBottom: '2px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '4px' }}>
              <span style={{ color: trainer2.color }}>{trainer2.name}</span>
              <img src={trainer2.img} alt={trainer2.name} style={{ width: '18px', height: '18px', imageRendering: 'pixelated' }} />
              {turn === 2 && <span style={{ animation: 'pulse 1s infinite' }}>◀</span>}
            </div>
            <TeamIndicator team={player2Team} hpArray={player2HP} activeIndex={player2Active} statuses={player2Status} canSwitch={turn === 2 && !animating} onSwitch={handleSwitch} />
            <BattlePokemon pokemon={p2Pokemon} hp={player2HP[player2Active]} maxHp={p2Pokemon.hp} status={player2Status[player2Active]} statBoosts={player2Boosts[player2Active]} shaking={shakeTarget === 2} flashing={flashTarget === 2} fainting={faintingPokemon === 2} isActive={turn === 2} />
          </div>

          {/* Player 1 */}
          <div style={{ width: landscape ? 'auto' : '100%', flex: landscape ? 1 : 'none', order: landscape ? 1 : 2, textAlign: 'center' }}>
            <div style={{ fontSize: '15px', fontWeight: 'bold', color: turn === 1 ? '#FFD700' : '#888', marginBottom: '2px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '4px' }}>
              {turn === 1 && <span style={{ animation: 'pulse 1s infinite' }}>▶</span>}
              <img src={trainer1.img} alt={trainer1.name} style={{ width: '18px', height: '18px', imageRendering: 'pixelated' }} />
              <span style={{ color: trainer1.color }}>{trainer1.name}</span>
            </div>
            <TeamIndicator team={player1Team} hpArray={player1HP} activeIndex={player1Active} statuses={player1Status} canSwitch={turn === 1 && !animating} onSwitch={handleSwitch} />
            <BattlePokemon pokemon={p1Pokemon} hp={player1HP[player1Active]} maxHp={p1Pokemon.hp} status={player1Status[player1Active]} statBoosts={player1Boosts[player1Active]} shaking={shakeTarget === 1} flashing={flashTarget === 1} fainting={faintingPokemon === 1} isActive={turn === 1} />
          </div>

          {/* Moves for whoever's turn it is */}
          <div style={{ width: landscape ? '300px' : '100%', flexShrink: 0, maxWidth: '360px', order: landscape ? 2 : 3, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2px' }}>
            <div style={{ fontSize: landscape ? '16px' : '20px' }}>⚔️</div>
            <div style={{ background: 'rgba(0,0,0,0.6)', borderRadius: '10px', padding: '6px', border: `2px solid ${currentTrainer.color}` }}>
              <div style={{ fontSize: '14px', color: '#FFD700', marginBottom: '4px', fontWeight: 'bold', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '3px' }}>
                <img src={currentPokemon.img} alt={currentPokemon.name} style={{ width: '28px', height: '28px' }} />
                {currentPokemon.name}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '2px' }}>
                {currentPokemon.attacks.map((attack, i) => <AttackButton key={i} attack={attack} disabled={animating} onClick={() => doAttack(attack)} defenderType={defenderType} slotIndex={i} />)}
              </div>
            </div>
          </div>
        </div>
        <style>{`@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }`}</style>
      </div>
    );
  }

  if (phase === 'gameover') {
    const winnerTrainer = winner === 1 ? trainer1 : winner === 2 ? trainer2 : null;
    const loserTrainer = winner === 1 ? trainer2 : winner === 2 ? trainer1 : null;
    const winningTeam = winner === 1 ? player1Team : winner === 2 ? player2Team : [];
    return (
      <div style={{ height: 'var(--vh, 100vh)', position: 'relative', fontFamily: "'Segoe UI', sans-serif", display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <AnimatedBackground />
        {showConfetti && <Confetti />}
        <style>{`
          @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
          @keyframes glow { 0%, 100% { text-shadow: 0 0 15px #FFD700; } 50% { text-shadow: 0 0 30px #FFD700, 0 0 50px #FFD700; } }
          @keyframes winnerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        `}</style>
        <div style={{ position: 'relative', zIndex: 1, textAlign: 'center', display: 'flex', alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap', gap: '16px', maxWidth: '100%', padding: '0 12px' }}>
          <div style={{ fontSize: '70px', animation: 'bounce 1s infinite' }}>🏆</div>
          
          {winnerTrainer ? (
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '70px', marginBottom: '5px', animation: 'winnerPulse 1.5s infinite', filter: `drop-shadow(0 0 15px ${winnerTrainer.color})` }}>{winnerTrainer.icon}</div>
              <h1 style={{ color: winnerTrainer.color, fontSize: '36px', margin: '0 0 5px 0', animation: 'glow 2s infinite' }}>
                {winnerTrainer.name} WINS!
              </h1>
              <div style={{ color: '#aaa', fontSize: '14px' }}>
                defeated {loserTrainer?.icon} {loserTrainer?.name}
              </div>
            </div>
          ) : (
            <div style={{ textAlign: 'center' }}>
              <h1 style={{ color: '#FFD700', fontSize: '36px', margin: '0 0 10px 0', animation: 'glow 2s infinite' }}>IT'S A DRAW!</h1>
              <div style={{ display: 'flex', gap: '15px', justifyContent: 'center', alignItems: 'center' }}>
                <div style={{ fontSize: '50px' }}>{trainer1?.icon}</div>
                <div style={{ fontSize: '24px', color: '#888' }}>🤝</div>
                <div style={{ fontSize: '50px' }}>{trainer2?.icon}</div>
              </div>
            </div>
          )}
          
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px' }}>
            {winnerTrainer && (
              <div style={{ display: 'flex', gap: '8px' }}>
                {winningTeam.map((p, i) => (
                  <div key={i} style={{ 
                    animation: `bounce 1s infinite ${i * 0.15}s`, 
                    filter: `drop-shadow(0 0 10px ${winnerTrainer.color})`,
                    background: 'rgba(0,0,0,0.3)',
                    borderRadius: '50%',
                    width: '60px',
                    height: '60px',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    overflow: 'hidden'
                  }}><img src={p.img} alt={p.name} style={{ width: '52px', height: '52px' }} /></div>
                ))}
              </div>
            )}
            <button onClick={resetGame} style={{ 
              padding: '12px 30px', fontSize: '18px', fontWeight: 'bold',
              background: 'linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%)', color: 'white',
              border: '2px solid #81C784', borderRadius: '12px', cursor: 'pointer'
            }}>
              🎮 PLAY AGAIN 🎮
            </button>
          </div>
        </div>
      </div>
    );
  }
}

    // Initialize React app with error handling
    try {
      const rootElement = document.getElementById('root');
      if (!rootElement) throw new Error('Root element not found');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<><FullscreenButton /><MuteButton /><PokemonBattle /></>);
    } catch (err) {
      console.error('Failed to initialize app:', err);
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a2e; color: white; font-family: sans-serif; padding: 20px; text-align: center;">' +
          '<div style="font-size: 48px; margin-bottom: 20px;">😵</div>' +
          '<div style="font-size: 20px; margin-bottom: 10px; color: #FF6B6B;">Failed to start game</div>' +
          '<div style="font-size: 14px; color: #888; margin-bottom: 20px;">' + err.message + '</div>' +
          '<button onclick="location.reload()" style="padding: 12px 24px; font-size: 16px; background: #4ECDC4; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Retry</button>' +
          '</div>';
      }
    }
  </script>
</body>
</html>
