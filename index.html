  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: manipulation;
      overscroll-behavior: none;
      background: #1a1a2e;
    }
    #root {
      height: 100dvh;
      height: var(--vh, 100vh);
      overflow: auto;
    }
    /* The game is played sideways. A phone held upright gets a "turn me" screen. */
    #turn-phone { display: none; }
    @media (orientation: portrait) and (max-width: 600px) {
      #turn-phone {
        display: flex; position: fixed; inset: 0; z-index: 100000;
        flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #1a1a2e; color: white; font: bold 22px 'Segoe UI', sans-serif; text-align: center;
      }
      #turn-phone .phone { font-size: 72px; animation: turnPhone 1.6s ease-in-out infinite; }
    }
    @keyframes turnPhone { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  </style>
  <script>
    // Fix iOS viewport height
    function setVH() {
      document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
    }
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', setVH);
    setVH();
    // Trigger minimal-ui on iOS
    window.scrollTo(0, 1);

    // Cache the game for offline play and instant re-launches.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // A phone that already has the game keeps showing its saved copy until
        // a new worker takes over. Reload once when that happens so an update
        // lands without deleting and re-adding the app.
        var hadController = !!navigator.serviceWorker.controller;
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || reloading) return;
          reloading = true;
          window.location.reload();
        });
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- The 3D battlefield, loaded on its own: if a phone cannot run it, the
       import fails quietly and the game uses the classic 2D battle. -->
  <script type="module">
    import('./battle3d.js').catch(function (err) { console.warn('3D battlefield unavailable:', err); });
  </script>
</head>

  <script>
    // Error handling for CDN failures
    window.onerror = function(msg, url, line) {
      var root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a2e; color: white; font-family: sans-serif; padding: 20px; text-align: center;">' +
          '<div style="font-size: 48px; margin-bottom: 20px;">😵</div>' +
          '<div style="font-size: 20px; margin-bottom: 10px; color: #FF6B6B;">Failed to load game</div>' +
          '<div style="font-size: 14px; color: #888; margin-bottom: 20px;">Error: ' + msg + '</div>' +
          '<button onclick="location.reload()" style="padding: 12px 24px; font-size: 16px; background: #4ECDC4; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Retry</button>' +
          '</div>';
      }
      return false;
    };
    // Timeout fallback - if app doesn't load in 10 seconds, show error
    window.appLoadTimeout = setTimeout(function() {
      var fallback = document.getElementById('loading-fallback');
      if (fallback) {
        fallback.innerHTML = '<div style="font-size: 48px; margin-bottom: 20px;">⏳</div>' +
          '<div style="font-size: 20px; margin-bottom: 10px; color: #FFD700;">Taking longer than expected...</div>' +
          '<div style="font-size: 14px; color: #888; margin-bottom: 20px;">The game resources may be slow to load.<br>Please wait or try refreshing.</div>' +
          '<button onclick="location.reload()" style="padding: 12px 24px; font-size: 16px; background: #4ECDC4; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Refresh</button>';
      }
    }, 10000);

// True when the phone is turned sideways, so the battle can lay itself out
// across the screen instead of down it.
const useIsLandscape = () => {
  const [landscape, setLandscape] = useState(() => window.innerWidth > window.innerHeight);
  useEffect(() => {
    const update = () => setLandscape(window.innerWidth > window.innerHeight);
    window.addEventListener('resize', update);
    window.addEventListener('orientationchange', update);
    return () => {
      window.removeEventListener('resize', update);
      window.removeEventListener('orientationchange', update);
    };
  }, []);
  return landscape;
};

// attacker, up to 25%. A slower one never dodges.
const getDodgeChance = (defenderSpd, attackerSpd) => Math.min(25, Math.max(0, (defenderSpd - attackerSpd) / 4));

// Enhanced sound system with attack sounds and Pokemon cries
const useSound = () => {
  // Shares the music's AudioContext, so one tap unlocks every sound.
  const getCtx = () => Music.context();
  
  // Create noise for various effects
  const createNoise = (ctx, duration) => {
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    return noise;
  };

  const playAttackSound = (type) => {
    if (Music.muted) return;
    if (Sounds.play('move-' + type)) return;   // the type's real recording, once loaded
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;
      
      switch(type) {
        case 'fire': {
          // Whooshing flame sound
          const noise = createNoise(ctx, 0.4);
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1000, now);
          filter.frequency.exponentialRampToValueAtTime(200, now + 0.4);
          filter.Q.value = 1;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.4);
          break;
        }
        case 'water': {
          // Splash/bubble sound
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          // Add bubbles
          const osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(800, now);
          const lfo = ctx.createOscillator();
          lfo.frequency.value = 20;
          const lfoGain = ctx.createGain();
          lfoGain.gain.value = 200;
          lfo.connect(lfoGain);
          lfoGain.connect(osc2.frequency);
          const gain2 = ctx.createGain();
          gain2.gain.setValueAtTime(0.15, now);
          gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          osc2.connect(gain2);
          gain.connect(ctx.destination);
          gain2.connect(ctx.destination);
          osc.start(now);
          osc2.start(now);
          lfo.start(now);
          osc.stop(now + 0.3);
          osc2.stop(now + 0.25);
          lfo.stop(now + 0.25);
          break;
        }
        case 'electric': {
          // Zappy crackle
          for (let i = 0; i < 5; i++) {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800 + Math.random() * 2000, now + i * 0.04);
            osc.frequency.exponentialRampToValueAtTime(200, now + i * 0.04 + 0.08);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.2, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.04 + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.04);
            osc.stop(now + i * 0.04 + 0.08);
          }
          break;
        }
        case 'ice': {
          // Crystalline shatter
          for (let i = 0; i < 6; i++) {
            const osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(2000 + i * 500, now + i * 0.03);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.15, now + i * 0.03);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.03 + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.03);
            osc.stop(now + i * 0.03 + 0.15);
          }
          break;
        }
        case 'grass': {
          // Rustling/whip sound
          const noise = createNoise(ctx, 0.25);
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 2000;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.25);
          break;
        }
        case 'psychic': {
          // Ethereal hum
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.2);
          osc.frequency.linearRampToValueAtTime(400, now + 0.4);
          const osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(303, now);
          osc2.frequency.linearRampToValueAtTime(603, now + 0.2);
          osc2.frequency.linearRampToValueAtTime(403, now + 0.4);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc2.start(now);
          osc.stop(now + 0.4);
          osc2.stop(now + 0.4);
          break;
        }
        case 'fighting': {
          // Punch impact
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          const noise = createNoise(ctx, 0.1);
          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.3, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          noise.connect(noiseGain);
          gain.connect(ctx.destination);
          noiseGain.connect(ctx.destination);
          osc.start(now);
          noise.start(now);
          osc.stop(now + 0.15);
          noise.stop(now + 0.1);
          break;
        }
        case 'rock':
        case 'ground': {
          // Rumbling crash
          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          const noise = createNoise(ctx, 0.3);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 500;
          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.3, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          noise.connect(filter);
          filter.connect(noiseGain);
          gain.connect(ctx.destination);
          noiseGain.connect(ctx.destination);
          osc.start(now);
          noise.start(now);
          osc.stop(now + 0.4);
          noise.stop(now + 0.3);
          break;
        }
        case 'ghost': {
          // Spooky whoosh
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.25, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
          break;
        }
        case 'dragon': {
          // Deep roar
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.5);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, now);
          filter.frequency.exponentialRampToValueAtTime(200, now + 0.5);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
          break;
        }
        case 'dark': {
          // Dark pulse
          const osc = ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.setValueAtTime(100, now);
          const lfo = ctx.createOscillator();
          lfo.frequency.value = 8;
          const lfoGain = ctx.createGain();
          lfoGain.gain.value = 30;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          lfo.start(now);
          osc.stop(now + 0.35);
          lfo.stop(now + 0.35);
          break;
        }
        case 'fairy': {
          // Sparkle/chime
          [1200, 1500, 1800, 2000].forEach((f, i) => {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = f;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.15, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.2);
          });
          break;
        }
        case 'steel': {
          // Metallic clang
          const osc = ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
          break;
        }
        case 'poison': {
          // Bubbling acid
          for (let i = 0; i < 8; i++) {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200 + Math.random() * 300, now + i * 0.04);
            osc.frequency.exponentialRampToValueAtTime(100, now + i * 0.04 + 0.1);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.12, now + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.04 + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.04);
            osc.stop(now + i * 0.04 + 0.1);
          }
          break;
        }
        case 'bug': {
          // Buzzing
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.value = 150;
          const lfo = ctx.createOscillator();
          lfo.frequency.value = 40;
          const lfoGain = ctx.createGain();
          lfoGain.gain.value = 50;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          lfo.start(now);
          osc.stop(now + 0.3);
          lfo.stop(now + 0.3);
          break;
        }
        case 'flying': {
          // Whooshing wind
          const noise = createNoise(ctx, 0.35);
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(500, now);
          filter.frequency.linearRampToValueAtTime(2000, now + 0.15);
          filter.frequency.linearRampToValueAtTime(500, now + 0.35);
          filter.Q.value = 2;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.3, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.35);
          break;
        }
        default: {
          // Normal hit
          const osc = ctx.createOscillator();
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      }
    } catch (e) { console.error(e); }
  };

  const playPokemonCry = (cryType) => {
    if (Music.muted) return;
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;
      
      switch(cryType) {
        case 'mouse': {
          // High pitched squeak
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.linearRampToValueAtTime(1800, now + 0.05);
          osc.frequency.linearRampToValueAtTime(1000, now + 0.15);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
          break;
        }
        case 'dragon': {
          // Roar
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1000, now);
          filter.frequency.exponentialRampToValueAtTime(300, now + 0.4);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
          break;
        }
        case 'canine': {
          // Yelp/bark
          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.linearRampToValueAtTime(800, now + 0.05);
          osc.frequency.linearRampToValueAtTime(400, now + 0.2);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
          break;
        }
        case 'bird': {
          // Screech
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1500, now);
          osc.frequency.linearRampToValueAtTime(2500, now + 0.05);
          osc.frequency.linearRampToValueAtTime(1200, now + 0.25);
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 2000;
          filter.Q.value = 5;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
          break;
        }
        case 'turtle': {
          // Low grunt
          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
          break;
        }
        case 'frog': {
          // Ribbit
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.linearRampToValueAtTime(400, now + 0.05);
          osc.frequency.linearRampToValueAtTime(150, now + 0.2);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.setValueAtTime(0.3, now + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
          break;
        }
        case 'ghost': {
          // Spooky moan
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(200, now + 0.4);
          const osc2 = ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(303, now);
          osc2.frequency.linearRampToValueAtTime(203, now + 0.4);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc2.start(now);
          osc.stop(now + 0.4);
          osc2.stop(now + 0.4);
          break;
        }
        case 'psychic': {
          // Ethereal cry
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.linearRampToValueAtTime(800, now + 0.15);
          osc.frequency.linearRampToValueAtTime(500, now + 0.3);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
          break;
        }
        case 'fighter': {
          // Grunt
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 500;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
          break;
        }
        case 'beast': {
          // Low growl
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 400;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
          break;
        }
        case 'rock': {
          // Grinding rumble
          const noise = createNoise(ctx, 0.3);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 300;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.3);
          break;
        }
        case 'whale': {
          // Deep whale call
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.2);
          osc.frequency.linearRampToValueAtTime(80, now + 0.5);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
          break;
        }
        case 'fairy': {
          // Cute chime
          [800, 1000, 1200].forEach((f, i) => {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = f;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.15, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.15);
          });
          break;
        }
        case 'plant': {
          // Rustling
          const noise = createNoise(ctx, 0.2);
          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 3000;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + 0.2);
          break;
        }
        case 'bug': {
          // Chittering screech
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.linearRampToValueAtTime(1200, now + 0.05);
          osc.frequency.linearRampToValueAtTime(600, now + 0.15);
          const lfo = ctx.createOscillator();
          lfo.frequency.value = 30;
          const lfoGain = ctx.createGain();
          lfoGain.gain.value = 100;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          lfo.start(now);
          osc.stop(now + 0.2);
          lfo.stop(now + 0.2);
          break;
        }
        default: {
          // Generic hurt sound
          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      }
    } catch (e) { console.error(e); }
  };

  const playSound = (type) => {
    if (Music.muted) return;
    // Real recordings (sounds.js) where there is one; the synth stands in while it loads.
    const recording = { miss: 'miss', faint: 'faint', superEffective: 'hit-big' }[type];
    if (recording && Sounds.play(recording)) return;
    if (type === 'victory') Sounds.play('cheer', { volume: 0.5 });   // a crowd under the win jingle
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      if (type === 'superEffective') { osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.2); gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
      else if (type === 'miss') { osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.25); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25); osc.start(now); osc.stop(now + 0.25); }
      else if (type === 'crit') { [700, 900, 1100].forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; g.gain.setValueAtTime(0.25, now + i * 0.07); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.07 + 0.1); o.start(now + i * 0.07); o.stop(now + i * 0.07 + 0.1); }); }
      else if (type === 'victory') { [523, 659, 784, 1047].forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; g.gain.setValueAtTime(0.2, now + i * 0.15); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.3); o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.3); }); }
      else if (type === 'faint') { osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.5); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5); }
      else if (type === 'select') { osc.frequency.value = 600; gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
      else if (type === 'heal') { [400, 500, 600, 700].forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; g.gain.setValueAtTime(0.15, now + i * 0.08); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.12); o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.12); }); }
      else if (type === 'boost') { [300, 400, 500, 600].forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; g.gain.setValueAtTime(0.15, now + i * 0.06); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.1); o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.1); }); }
      else if (type === 'vs') { [200, 300, 400, 600, 800].forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; g.gain.setValueAtTime(0.2, now + i * 0.1); g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15); o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.15); }); }
    } catch (e) {}
  };

  return { playSound, playAttackSound, playPokemonCry };
};

// Fullscreen toggle button component
const FullscreenButton = () => {
  const [isFullscreen, setIsFullscreen] = useState(false);
  const [showIOSHelp, setShowIOSHelp] = useState(false);
  
  // Detect iOS
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const toggleFullscreen = () => {
    if (isIOS) {
      setShowIOSHelp(true);
      return;
    }
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) {
      setShowIOSHelp(true);
    }
  };

  useEffect(() => {
    const handler = () => setIsFullscreen(!!document.fullscreenElement || !!document.webkitFullscreenElement);
    document.addEventListener("fullscreenchange", handler);
    document.addEventListener("webkitfullscreenchange", handler);
    return () => {
      document.removeEventListener("fullscreenchange", handler);
      document.removeEventListener("webkitfullscreenchange", handler);
    };
  }, []);

  return (
    <>
      <button
        onClick={toggleFullscreen}
        title={isFullscreen ? "Exit Fullscreen" : "Enter Fullscreen"}
        style={{
          position: "fixed",
          top: "10px",
          right: "10px",
          width: "40px",
          height: "40px",
          background: "rgba(0, 0, 0, 0.6)",
          border: "2px solid rgba(255, 255, 255, 0.3)",
          borderRadius: "8px",
          color: "white",
          fontSize: "22px",
          cursor: "pointer",
          zIndex: 9999,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          WebkitTapHighlightColor: "transparent",
          touchAction: "manipulation"
        }}
      >
        {isFullscreen ? "⤢" : "⤢"}
      </button>
      {showIOSHelp && (
        <div 
          onClick={() => setShowIOSHelp(false)}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.85)",
            zIndex: 10000,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: "20px"
          }}
        >
          <div style={{
            background: "#1a1a2e",
            border: "2px solid #4ECDC4",
            borderRadius: "16px",
            padding: "24px",
            maxWidth: "320px",
            textAlign: "center",
            color: "white"
          }}>
            <div style={{ fontSize: "48px", marginBottom: "16px" }}>📱</div>
            <h3 style={{ margin: "0 0 12px 0", color: "#4ECDC4" }}>Fullscreen on iOS</h3>
            <p style={{ margin: "0 0 16px 0", fontSize: "14px", lineHeight: "1.5" }}>
              iOS doesn't support browser fullscreen. For the best experience:
            </p>
            <ol style={{ textAlign: "left", fontSize: "14px", lineHeight: "1.8", paddingLeft: "20px", margin: "0 0 16px 0" }}>
              <li>Tap the <strong>Share</strong> button (box with arrow)</li>
              <li>Scroll down and tap <strong>"Add to Home Screen"</strong></li>
              <li>Open from your home screen</li>
            </ol>
            <p style={{ margin: "0 0 16px 0", fontSize: "12px", opacity: 0.7 }}>

// Opening screen. Phones only allow sound after a tap, so it waits for one,
// then plays the intro with sound effects and ends on the title and a PLAY button.
// Tapping during the intro skips to the end.
const TitleScreen = ({ onPlay, playSound, playAttackSound }) => {
  const [stage, setStage] = useState('tap'); // tap → intro → ready (or skipped)
  useEffect(() => {
    if (stage !== 'intro') return;
    const timers = [
      setTimeout(() => playSound('vs'), 1000),                  // the ball bursts open
      setTimeout(() => playAttackSound('electric'), 1600),      // the Pokemon fly in
      setTimeout(() => playAttackSound('rock'), 2500),          // the title slams down
      setTimeout(() => setStage('ready'), 3800),
    ];
    return () => timers.forEach(clearTimeout);
  }, [stage]);
  const tap = () => {
    if (stage === 'tap') {
      Music.context();
      // The first tap is when phones allow sound, so fetch the effects now.
      Sounds.warm();
      Object.keys(TYPE_DATA).forEach(type => Sounds.load('move-' + type));
      setStage('intro');
    }
    else if (stage === 'intro') setStage('skipped');
  };
  // Each piece plays its entrance once, then keeps its idle motion. Skipping drops the entrances.
  const anim = (entrance, idle) => stage === 'skipped' ? idle || 'none' : [entrance, idle].filter(Boolean).join(', ');
  const sprite = { height: 'min(36vh, 40vw)', imageRendering: 'pixelated', filter: 'drop-shadow(0 6px 10px rgba(0,0,0,0.6))' };
  const ball = 'min(40vw, 40vh)';
  return (
    <div onClick={tap} style={{ position: 'fixed', inset: 0, overflow: 'hidden', background: 'radial-gradient(circle at 50% 45%, #1e3a8a 0%, #0f1b4d 45%, #070b1f 100%)', fontFamily: "'Arial Black', 'Segoe UI', sans-serif", cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <style>{`
        @keyframes titleBounce { 50% { transform: translateY(-18px); } }
